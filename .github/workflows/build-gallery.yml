name: Build photo gallery

# Rebuilds thumbnails + manifest whenever photos are added/removed.
# Triggered by any push that touches photos/ (upload from web, phone or PC).
on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - '.github/workflows/build-gallery.yml'
      - '.github/scripts/build-gallery.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ImageMagick is available
        run: convert -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Build manifest and thumbnails
        run: node .github/scripts/build-gallery.mjs

      - name: Commit generated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/manifest.json gallery/thumbs
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
          else
            git commit -m "Rebuild photo gallery [skip ci]"
            git push
          fi
